[pytest]
testpaths = tests
pythonpath = .
# --alluredir: every run writes raw Allure results (cleaned first) -> see run_tests.py / README
addopts = -v --strict-markers --alluredir=allure-results --clean-alluredir
markers =
    smoke: quick, critical checks - run on every commit
    regression: full coverage - run nightly
    desktop: needs a Windows desktop session (Calculator / Notepad)
    cli: command-line tests - run on any OS, including Linux CI runners
    calculator: tests for Windows Calculator   (select with --app calculator)
    notepad: tests for Windows Notepad          (select with --app notepad)
    excel: tests for Microsoft Excel           (select with --app excel)
log_cli = false
log_level = INFO
